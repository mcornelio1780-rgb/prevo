<style>
:root{--ink:#0E1630;--ultra:#2E3CF0;--mist:#CBD2FF;--saffron:#FFB020;--paper:#F3F4F7;--slate:#5B6478;--line:#D9DCE4;--card:#fff;
--display:'Bricolage Grotesque','Avenir Next','Segoe UI',sans-serif;--body:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#0B1124;--ink:#E9ECF5;--card:#131B33;--line:#26304D;--slate:#9AA3BB;--mist:#3A4890;color-scheme:dark}}
:root[data-theme=dark]{--paper:#0B1124;--ink:#E9ECF5;--card:#131B33;--line:#26304D;--slate:#9AA3BB;--mist:#3A4890;color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(80px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
:focus-visible{outline:3px solid var(--saffron);outline-offset:3px}
a{color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.025em}
.wrap{max-width:1240px;margin:0 auto;padding:0 5vw}
/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:20px}
.nav ul{display:flex;gap:26px;list-style:none;margin:0;padding:0;font-size:15px}
.nav ul a{text-decoration:none;color:var(--slate)}.nav ul a:hover{color:var(--ink)}
.nav .r{display:flex;gap:10px;align-items:center}
.langs{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.langs button{border:0;background:none;padding:7px 10px;font:600 13px var(--body);color:var(--slate);cursor:pointer}
.langs button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:999px;font:600 16px var(--body);text-decoration:none;cursor:pointer;border:1px solid transparent;transition:background .15s}
.btn.p{background:#2E3CF0;color:#fff}.btn.p:hover{background:#2230d0}
.btn.s{border-color:var(--line);background:var(--card);color:var(--ink)}
.btn.y{background:#FFB020;color:#0E1630}
.btn.sm{padding:9px 16px;font-size:14px}
/* hero */
.hero{padding:9vh 0 0;position:relative}
.hero h1{font-size:clamp(48px,8.4vw,128px);line-height:.93;font-weight:800;letter-spacing:-.045em;max-width:11ch}
.hero p.lead{font-size:clamp(18px,1.6vw,22px);color:var(--slate);max-width:44ch;margin:28px 0 30px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.hero .trust{margin-top:18px;font-size:14px;color:var(--slate);display:flex;gap:8px;align-items:center}
.fanwrap{margin-top:7vh;position:relative}
#fan{width:100%;height:auto;display:block}
#fan .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.6s cubic-bezier(.6,0,.2,1) forwards}
#fan .cone{opacity:0;transform-origin:50% 50%;animation:fade .9s 1.5s forwards}
#fan .now{opacity:0;animation:fade .3s 1.4s forwards}
#fan .fdash{opacity:0;animation:fade .6s 1.9s forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fade{to{opacity:1}}
.flabels{display:flex;justify-content:space-between;font-size:13px;color:var(--slate);border-top:1px solid var(--line);padding:10px 0 0}
/* marquee */
.marquee{border-block:1px solid var(--line);overflow:hidden;padding:22px 0;margin-top:70px}
.track{display:flex;gap:56px;width:max-content;animation:scroll 48s linear infinite;font:700 clamp(28px,3.6vw,52px)/1 var(--display);letter-spacing:-.03em}
.track span{display:flex;align-items:center;gap:56px;white-space:nowrap}
.track span::after{content:"";width:14px;height:14px;border-radius:50%;border:4px solid #FFB020}
.marquee:hover .track{animation-play-state:paused}
@keyframes scroll{to{transform:translateX(-50%)}}
/* sections */
section.blk{padding:130px 0}
.chap{display:grid;grid-template-columns:220px 1fr;gap:40px;align-items:start}
.chap .k{font-size:14px;color:var(--slate);padding-top:12px;border-top:2px solid var(--ink)}
h2.big{font-size:clamp(38px,5.2vw,78px);line-height:1;font-weight:700;max-width:15ch}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:60px;border-top:1px solid var(--line)}
.pgrid > div{padding:28px 28px 0 0;border-right:1px solid var(--line);margin-right:28px}
.pgrid > div:last-child{border-right:0}
.pgrid h3{font-size:22px;margin-bottom:10px}.pgrid p{color:var(--slate);margin:0;max-width:34ch}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:70px;border-top:2px solid var(--ink)}
.stats>div{padding:26px 22px 26px 0;border-right:1px solid var(--line);margin-right:22px}.stats>div:last-child{border-right:0}
.stats b{display:block;font:800 clamp(32px,3.6vw,54px)/1 var(--display);letter-spacing:-.04em;color:var(--ultra)}
.stats p{margin:12px 0 6px;color:var(--ink);font-size:15.5px}.stats a{font-size:12.5px;color:var(--slate)}
.solve{margin-top:70px;display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:40px;border-radius:22px;background:var(--card);border:1px solid var(--line)}
.solve h3{font-size:clamp(26px,2.6vw,36px);line-height:1.1}.solve ul{margin:0;padding-left:20px;display:grid;gap:10px}
@media (max-width:1000px){.stats{grid-template-columns:1fr 1fr}.stats>div{border-right:0}.solve{grid-template-columns:1fr;padding:28px}}
/* how */
.how{background:#0E1630;color:#F3F4F7}
.how .k{border-color:#F3F4F7;color:#CBD2FF}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:64px;counter-reset:s}
.step{border-top:1px solid #33406A;padding-top:22px}
.step b{font:800 64px/1 var(--display);color:#2E3CF0;letter-spacing:-.04em;display:block;margin-bottom:22px}
.step:nth-child(2) b{color:#FFB020}
.step h3{font-size:24px;margin-bottom:10px}.step p{color:#B8C0DA;margin:0}
.demo{margin-top:80px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.demo a{display:block;padding:24px;border-radius:14px;background:#17213F;text-decoration:none;border:1px solid #26304D;transition:border-color .2s}
.demo a:hover{border-color:#CBD2FF}
.demo strong{font:700 20px var(--display);display:block;margin:12px 0 4px}.demo small{color:#9AA3BB}
/* cases */
.cases{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:60px}
.case{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px;display:flex;flex-direction:column;gap:14px}
.case h3{font-size:26px}.case p{margin:0;color:var(--slate)}
.case .r{display:flex;gap:28px;margin-top:auto;padding-top:18px;border-top:1px solid var(--line);font-size:14px;color:var(--slate)}
.case .r b{display:block;font:700 22px var(--display);color:var(--ink)}
/* pricing */
.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:60px;align-items:stretch}
.price{border:1px solid var(--line);border-radius:18px;padding:32px;background:var(--card);display:flex;flex-direction:column}
.price.f{background:#2E3CF0;color:#fff;border-color:#2E3CF0}
.price h3{font-size:22px}.price .amt{font:800 56px/1 var(--display);letter-spacing:-.04em;margin:20px 0 4px}
.price .amt s{font-size:24px;opacity:.55;font-weight:500;margin-left:8px}
.price .per{font-size:14px;opacity:.75}
.price ul{padding:0;list-style:none;margin:24px 0 28px;display:grid;gap:10px;font-size:15px}
.price li{display:flex;gap:10px}.price li::before{content:"";flex:none;width:8px;height:8px;margin-top:8px;border-radius:50%;border:2.5px solid currentColor}
.price .btn{margin-top:auto}
.price.f .note{color:#CBD2FF}
.note{font-size:13px;color:var(--slate)}
/* compare */
.tw{overflow-x:auto;margin-top:50px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:15px}
th,td{padding:16px 14px;border-bottom:1px solid var(--line);text-align:left}
th{font-weight:600;color:var(--slate);font-size:14px}
td.us{background:rgba(46,60,240,.08);font-weight:600}
/* faq */
details{border-bottom:1px solid var(--line);padding:22px 0}
summary{cursor:pointer;font:600 20px/1.3 var(--display);list-style:none;display:flex;justify-content:space-between;gap:20px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:28px;line-height:1;color:var(--ultra);transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details p{color:var(--slate);max-width:64ch;margin:14px 0 0}
/* final */
.final{background:#2E3CF0;color:#fff;border-radius:28px;padding:70px 6vw;display:grid;grid-template-columns:1.2fr 1fr;gap:50px;align-items:center;margin:0 5vw 100px}
.final h2{font-size:clamp(36px,4.6vw,64px);line-height:1;font-weight:800}
.final form{display:grid;gap:12px}
.final input,.final select{padding:14px 16px;border-radius:12px;border:0;font:inherit;background:#fff;color:#0E1630}
.final .note{color:#DCE0FF}
footer{border-top:1px solid var(--line);padding:50px 0 calc(40px + env(safe-area-inset-bottom,0px));font-size:14px;color:var(--slate)}
footer .wrap{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:30px}
footer h4{color:var(--ink);font:600 14px var(--body);margin:0 0 12px}
footer a{display:block;text-decoration:none;margin-bottom:8px}footer a:hover{color:var(--ink)}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#0E1630;color:#fff;padding:14px 20px;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:40}.toast.on{opacity:1}
.menu{display:none}
@media (max-width:1000px){.nav ul{display:none}.chap{grid-template-columns:1fr;gap:18px}.pgrid,.steps,.prices,.demo{grid-template-columns:1fr}.pgrid>div{border-right:0;margin:0;border-bottom:1px solid var(--line);padding-bottom:24px}.cases{grid-template-columns:1fr}.final{grid-template-columns:1fr}footer .wrap{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.nav .r a.mvp{display:none}.final{margin:0 3vw 60px;padding:48px 24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#fan .draw{stroke-dashoffset:0}#fan .cone,#fan .now,#fan .fdash{opacity:1}}

const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const C=Prevo.C;let L=Prevo.getLang();
window.addEventListener('error',e=>{e.preventDefault();return true});
const money=v=>L=='fr'?v+' $':(L=='pt'?'US$ '+v:'$'+v);
function apply(){try{applyInner()}catch(err){console.warn('lang',err)}}
function applyInner(){const d=T[L];document.documentElement.lang=L;document.title='Prevo — '+d.h1.replace(/\.$/,'');
$$('[data-i]').forEach(e=>{const v=d[e.dataset.i];if(typeof v=='string')e.textContent=v});
$$('[data-list]').forEach(u=>u.innerHTML=d[u.dataset.list].map(x=>`<li>${x}</li>`).join(''));
$('#track').innerHTML=[...d.words,...d.words].map(w=>`<span>${w}</span>`).join('');
$('#cmp').innerHTML=d.cmp.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td class="us">${r[4]}</td></tr>`).join('');
$('#faqs').innerHTML=[...d.faq,...d.faqX].map((f,i)=>`<details ${i==0?'open':''}><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('');
$('#em').placeholder=d.ph1;$('#co').placeholder=d.ph2;$('#msg').placeholder=d.ph3;
const cur=$('#pl').value||'founders';$('#pl').innerHTML=Object.entries(d.plans).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');$('#pl').value=cur;
$$('[data-price]').forEach(e=>e.textContent=money((C.prices||{})[e.dataset.price]||e.textContent.replace(/\D/g,'')));
$$('.langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l==L));
$$('a.mvp').forEach(a=>a.href=Prevo.link('app.html'));$$('a.dlink').forEach(a=>a.href=Prevo.link('app.html',{sample:a.dataset.s}));
$$('a.lg').forEach(a=>a.href=Prevo.link('legal.html')+'#'+a.dataset.h);
Prevo.renderAuth($('#authNav'),{next:'app.html'});if(window.__cp)window.__cp();}
$$('.langs button').forEach(b=>b.onclick=()=>{L=b.dataset.l;Prevo.setLang(L);apply()});
const lt=Prevo.isDark()?'negative':'positive';$('#logo').innerHTML=Prevo.logo(lt,30);$('#flogo').innerHTML=Prevo.logo(lt,28);
$('#cty').innerHTML=COUNTRIES.map(c=>`<option>${c}</option>`).join('');
$('#mailto').href='mailto:'+(C.contactEmail||'hola@prevo.ai');$('#mailto').textContent=C.contactEmail||'hola@prevo.ai';
window.__cp=()=>$('#copy').textContent='© 2026 '+(C.legalName||'Limly LLC')+' · '+T[L].owner.replace('{n}',C.legalName||'Limly LLC');
function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),ms||3500)}
$$('.buy').forEach(a=>a.onclick=async e=>{e.preventDefault();const plan=a.dataset.plan;
  const r=await Prevo.checkout(plan,{medium:'landing-pricing'});
  if(!r.ok){$('#pl').value=plan;document.querySelector('#contact').scrollIntoView({behavior:'smooth'});if(plan!='industrial')toast(T[L].payOff,5000);setTimeout(()=>$('#em').focus(),600)}});
$('#lead').onsubmit=async e=>{e.preventDefault();const d=T[L];const email=$('#em').value.trim();
  if(!Prevo.emailOk(email)){toast(d.errEmail);$('#em').focus();return}
  const btn=$('#fnBtn');btn.disabled=true;btn.textContent=d.sending;
  const r=await Prevo.saveLead({email,company:$('#co').value.trim()||null,country:$('#cty').value,plan:$('#pl').value,message:$('#msg').value.trim()||null,source:'landing-contact',_hp:$('#hp').value});
  btn.disabled=false;btn.textContent=d.fnB;
  if(r.where=='supabase'||r.where=='notify'||r.where=='spam'){toast(d.ok);e.target.reset();$('#pl').value='founders'}
  else{toast(d.errSave+(C.contactEmail||'hola@prevo.ai'),6000);setTimeout(()=>location.href=`mailto:${C.contactEmail||'hola@prevo.ai'}?subject=${encodeURIComponent('Prevo · '+($('#co').value||email))}&body=${encodeURIComponent(email+'\n'+$('#co').value+'\n'+$('#cty').value+'\n'+$('#pl').value+'\n\n'+$('#msg').value)}`,1200)}};
Prevo.onAuth(()=>Prevo.renderAuth($('#authNav'),{next:'app.html'}));
apply();
</script></body></html>
